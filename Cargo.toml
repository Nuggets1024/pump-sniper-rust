[package]
name = "pump-sniper"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "高性能 Pump.fun 跟盘狙击"
license = "MIT"
publish = false

[[bin]]
name = "pump-sniper"
path = "src/main.rs"

[[example]]
name = "probe-geyser"
path = "examples/probe_geyser.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
bincode = "1"
bs58 = "0.5"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dashmap = "6"
futures = "0.3"
parking_lot = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-client = "=4.2.2"
solana-account-decoder-client-types = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-rpc-client = "=4.2.2"
solana-rpc-client-api = "=4.2.2"
solana-sdk = "=4.0.1"
solana-transaction-status = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-transaction-error = { version = "=3.3.2", features = ["wincode"] }
solana-commitment-config = "=3.1.1"
solana-entry = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-compute-budget-interface = "=3.0.0"
solana-system-interface = "=3.2.0"
solana-program-pack = "=3.1.0"
solana-sysvar = "=4.1.0"
sol-parser-sdk = "=0.7.1"
solana-streamer-sdk = "=3.0.1"
spl-associated-token-account = "=8.0.0"
spl-token = "=9.0.0"
spl-token-2022 = "=11.0.0"
# 强制 five8_core 到 0.1.2，规避 five8 1.0.0 的 DecodeError 与 solana-keypair 3.1.2 的兼容 bug
five8_core = "=0.1.2"
# 规避 spl-list-view 0.1.1 与 spl-pod 0.7.2 的类型不兼容
spl-list-view = "=0.1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "chrono", "local-time"] }
unicode-width = "0.2"
wincode = "=0.5.5"
yellowstone-grpc-client = "=13.5.0"
yellowstone-grpc-proto = "=12.7.0"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 1
